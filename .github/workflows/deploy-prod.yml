name: Deploy Prod
on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types:
      - completed
permissions:
  contents: read
  actions: read
jobs:
  prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: prod
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: octomatch
          path: website
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify production artifact (simulation only)
        run: |
          echo "Downloaded artifact contents:"
          tree website
          echo "Training simulation only. Nothing is deployed to production."
